# Rosé Pine
# https://github.com/rose-pine/lazygit/blob/main/themes/rose-pine.yml
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#31748f"
      - "bold"
    inactiveBorderColor:
      - "#6e6a86"
    searchingActiveBorderColor:
      - "#ebbcba"
      - "bold"
    optionsTextColor:
      - "#9ccfd8"
    selectedLineBgColor:
      - "#31748f"
    inactiveViewSelectedLineBgColor:
      - "#26233a"
      - "bold"
    cherryPickedCommitFgColor:
      - "#1f1d2e"
    cherryPickedCommitBgColor:
      - "#ebbcba"
    markedBaseCommitFgColor:
      - "#9ccfd8"
    markedBaseCommitBgColor:
      - "#f6c177"
    unstagedChangesColor:
      - "#eb6f92"
    defaultFgColor:
      - "#e0def4"

  # Filter mode: When searching/filtering, use fuzzy matching
  filterMode: fuzzy

  spinner:
    # The frames of the spinner animation.
    frames:
      - "⠋"
      - "⠙"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
    # The "speed" of the spinner in milliseconds.
    rate: 30

# Don't prompt to return from subprocess when closing child processes (commitizen, etc)
promptToReturnFromSubprocess: false

git:
  diffRenderers:
    - name: delta
      type: stdinFilter
      colorArg: always
      command: delta --dark --paging=never --line-numbers --hyperlinks
